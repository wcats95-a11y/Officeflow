name: OfficeFlow regression and build

on:
  push:
    branches:
      - feat/officeflow-2-modern-ui
      - feat/workspace-email-invitations
  pull_request:
    branches:
      - feat/officeflow-2-modern-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --onnxruntime-node-install-cuda=skip
      - name: Run regression suite and production build
        run: npm run build
